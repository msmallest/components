<form class="example-form">
  <mat-form-field class="example-full-width">
    <mat-label>State</mat-label>
    <input matInput
           aria-label="State"
           [matAutocomplete]="auto"
           [formField]="stateField.value">
    <mat-autocomplete #auto="matAutocomplete">
      @for (state of filteredStates(); track state) {
        <mat-option [value]="state.name">
          <img alt="" class="example-option-img" [src]="state.flag" height="25">
          <span>{{state.name}}</span> |
          <small>Population: {{state.population}}</small>
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>

  <br>

  <mat-slide-toggle
    [checked]="stateField.disabled().value"
    (change)="stateField().value.update(value => ({...value, disabled: !value.disabled}))">
    Disable Input?
  </mat-slide-toggle>
</form>
